<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Clan Registry — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: radial-gradient(120% 70% at 50% 0%, #2a160d, var(--bg)); min-height: 100vh; }
    .wrap { max-width: 1100px; padding-top: 24px; }
    h1.admin-title { font-size: 40px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .top h1 { font-size: 32px; text-align: left; }
    .login { max-width: 420px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 14px; }

    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: rgba(16, 9, 5, 0.6); border-radius: 14px; padding: 12px 14px; }
    .stat b { display: block; font-family: "Yatra One", sans-serif; font-weight: 400; font-size: 26px; color: var(--fire-hi); line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 13px; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
    .tabs button {
      flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
      background: rgba(16, 9, 5, 0.55); border: 0; border-radius: 999px; padding: 9px 14px; cursor: pointer; min-height: 40px;
    }
    .tabs button[aria-pressed="true"] { color: #2a160a; background: linear-gradient(180deg, var(--fire-hi), var(--fire)); }
    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .tools input { grid-column: span 2; }

    /* Phone: one card per registration */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: rgba(16, 9, 5, 0.55); border-radius: 14px; padding: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card h3 { margin: 0; font-size: 17px; }
    .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; word-break: break-all; }
    .card .meta a { color: inherit; }
    .people { margin: 10px 0; padding: 0; list-style: none; font-size: 14px; }
    .people li { padding: 3px 0; border-bottom: 1px dashed rgba(196, 169, 136, 0.15); }
    .people small { color: var(--muted); }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .card-foot .amt { font-weight: 800; color: var(--fire-hi); font-size: 18px; }
    .utr { font-size: 13px; color: var(--muted); }
    .utr code { color: var(--ink); }
    .pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .pill.paid { background: rgba(143, 209, 138, 0.18); color: var(--ok); }
    .pill.claimed { background: rgba(255, 195, 90, 0.18); color: var(--fire-hi); }
    .pill.unpaid { background: rgba(255, 155, 122, 0.15); color: var(--err); }
    .act { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
    .act.ok { color: #10230e; background: var(--ok); }
    .act.undo { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
    .secondary { white-space: nowrap; font: inherit; font-weight: 700; color: var(--ink); background: rgba(16, 9, 5, 0.6); border: 1px solid rgba(0, 0, 0, 0.5); border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
    .empty { text-align: center; color: var(--muted); padding: 24px; }

    @media (min-width: 700px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
      .tools { grid-template-columns: 1fr auto auto; }
      .tools input { grid-column: auto; }
      .list { display: grid; grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1000px) {
      .list { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView" hidden>
      <form class="tablet login" id="loginForm">
        <h1 class="admin-title">Clan Registry</h1>
        <label class="field"><span>Username</span><input name="user" autocomplete="username" required /></label>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="error" id="loginErr" role="alert" hidden></p>
        <button class="primary" type="submit">Log in</button>
      </form>
    </section>

    <section id="appView" hidden>
      <div class="top">
        <h1>Clan Registry</h1>
        <button class="secondary" id="logout" type="button">Log out</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs" role="group" aria-label="Filter by payment">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="paid" aria-pressed="false">Paid</button>
        <button data-f="claimed" aria-pressed="false">To verify</button>
        <button data-f="unpaid" aria-pressed="false">Unpaid</button>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search name, email, phone, ID, UTR" />
        <button class="secondary" id="refresh" type="button">Refresh</button>
        <button class="secondary" id="csv" type="button">Download CSV</button>
      </div>
      <p class="error" id="err" hidden></p>
      <div class="list" id="list"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
    const status = (r) => r.payment?.status || "unpaid";
    const LABEL = { paid: "Paid", claimed: "To verify", unpaid: "Unpaid" };
    let rows = [];
    let filter = "all";

    function show(view) {
      $("loginView").hidden = view !== "login";
      $("appView").hidden = view !== "app";
    }

    function foodCount(r) {
      const all = [r.food, ...r.guests.map((g) => g.food)];
      return { veg: all.filter((f) => f === "veg").length, nonveg: all.filter((f) => f === "nonveg").length };
    }

    function card(r) {
      const st = status(r);
      const people = [{ name: r.name, age: r.age, food: r.food, main: true }, ...r.guests];
      const action = st === "paid"
        ? `<button class="act undo" data-id="${esc(r.id)}" data-paid="0">Undo paid</button>`
        : `<button class="act ok" data-id="${esc(r.id)}" data-paid="1">Mark paid</button>`;
      return `<article class="card">
        <div class="card-head">
          <div><h3>${esc(r.name)}</h3>
            <div class="meta">${esc(r.id)} · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a><br>${esc(r.email)}</div></div>
          <span class="pill ${st}">${LABEL[st]}</span>
        </div>
        <ul class="people">${people.map((p) => `<li>${esc(p.name)} <small>· ${p.age} yrs · ${p.food === "veg" ? "Veg" : "Non-veg"}${p.main ? " · main" : ""}</small></li>`).join("")}</ul>
        <div class="utr">Ethnic wear: <b>${r.ethnic === "yes" ? "Yes" : "No"}</b>${r.payment?.utr ? ` · UTR <code>${esc(r.payment.utr)}</code>` : ""}</div>
        <div class="card-foot" style="margin-top:10px">
          <span class="amt">${inr(r.total)} <small style="color:var(--muted);font-weight:400;font-size:13px">${r.count} × ₹250</small></span>
          ${action}
        </div>
      </article>`;
    }

    function draw() {
      const q = $("q").value.trim().toLowerCase();
      const list = rows.filter((r) =>
        (filter === "all" || status(r) === filter) &&
        (!q || [r.name, r.email, r.phone, r.id, r.payment?.utr, ...r.guests.map((g) => g.name)].join(" ").toLowerCase().includes(q))
      );
      $("list").innerHTML = list.map(card).join("") || `<p class="empty">No registrations here yet.</p>`;

      const paid = rows.filter((r) => status(r) === "paid");
      const people = rows.reduce((s, r) => s + r.count, 0);
      const paidPeople = paid.reduce((s, r) => s + r.count, 0);
      const food = rows.reduce((s, r) => { const f = foodCount(r); s.v += f.veg; s.n += f.nonveg; return s; }, { v: 0, n: 0 });
      $("stats").innerHTML = [
        [rows.length, "Registrations"],
        [`${paid.length} / ${rows.length}`, "Paid"],
        [inr(paid.reduce((s, r) => s + r.total, 0)), "Collected"],
        [inr(people * 250), "Expected"],
        [`${paidPeople} / ${people}`, "People paid"],
        [rows.filter((r) => status(r) === "claimed").length, "To verify"],
        [`${food.v} / ${food.n}`, "Veg / Non-veg"],
        [rows.filter((r) => r.ethnic === "yes").length, "Ethnic wear"],
      ].map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
    }

    async function load() {
      $("err").hidden = true;
      const res = await fetch("/api/registrations");
      if (res.status === 401) return show("login");
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $("err").textContent = out.error || "Failed to load."; $("err").hidden = false; return; }
      rows = out.rows;
      show("app");
      draw();
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginErr").hidden = true;
      const f = e.target;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: f.user.value.trim(), password: f.password.value }),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $("loginErr").textContent = out.error || "Login failed."; $("loginErr").hidden = false; return; }
      f.password.value = "";
      load();
    });

    $("logout").addEventListener("click", async () => {
      await fetch("/api/login", { method: "DELETE" });
      rows = [];
      show("login");
    });

    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-f]");
      if (!b) return;
      filter = b.dataset.f;
      $("tabs").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      draw();
    });

    $("list").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      b.disabled = true;
      const res = await fetch("/api/registrations", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: b.dataset.id, paid: b.dataset.paid === "1" }),
      });
      if (res.status === 401) return show("login");
      const out = await res.json().catch(() => ({}));
      if (res.ok) rows = rows.map((r) => (r.id === out.row.id ? out.row : r));
      draw();
    });

    $("q").addEventListener("input", draw);
    $("refresh").addEventListener("click", load);
    $("csv").addEventListener("click", () => {
      const head = ["id", "role", "name", "age", "food", "email", "phone", "ethnic", "group_total", "payment", "utr", "created_at"];
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [head.join(",")];
      rows.forEach((r) => {
        lines.push([r.id, "main", r.name, r.age, r.food, r.email, r.phone, r.ethnic, r.total, status(r), r.payment?.utr, r.createdAt].map(q).join(","));
        r.guests.forEach((g) => lines.push([r.id, "guest", g.name, g.age, g.food, "", "", "", "", "", "", ""].map(q).join(",")));
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      a.download = "diwali-registrations.csv";
      a.click();
    });

    load();
  </script>
</body>
</html>
