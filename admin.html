<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Diwali Registrations</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { background: radial-gradient(120% 80% at 50% 0%, #2a160d, var(--bg)); min-height: 100vh; }
    .wrap { max-width: 1100px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0; }
    .stat { background: rgba(16, 9, 5, 0.6); border-radius: 14px; padding: 14px 16px; }
    .stat b { display: block; font-family: "Rubik Dirt", sans-serif; font-weight: 400; font-size: 30px; color: var(--fire-hi); }
    .stat span { color: var(--muted); font-size: 13px; }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .bar input { flex: 1 1 200px; }
    .bar button { width: auto; padding: 11px 18px; }
    .tbl { overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(0, 0, 0, 0.4); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td small { color: var(--muted); display: block; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><h1 style="font-size: clamp(36px, 8vw, 56px)">Clan Registry</h1></header>
    <section class="tablet">
      <form class="bar" id="keyForm">
        <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" />
        <button class="primary" type="submit">Open</button>
        <button class="primary" type="button" id="csv" hidden>Download CSV</button>
      </form>
      <p class="error" id="err" hidden></p>
      <div id="out" hidden>
        <div class="stats" id="stats"></div>
        <input id="q" placeholder="Search name, email, phone, ID" />
        <div class="tbl"><table><thead><tr>
          <th>#</th><th>ID</th><th>Main person</th><th>Phone</th><th>People</th><th>Food</th><th>Ethnic</th><th>Total</th><th>When</th>
        </tr></thead><tbody id="rows"></tbody></table></div>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const inr = (n) => "₹" + n.toLocaleString("en-IN");
    let rows = [];

    function foodCount(r) {
      const all = [r.food, ...r.guests.map((g) => g.food)];
      return { veg: all.filter((f) => f === "veg").length, nonveg: all.filter((f) => f === "nonveg").length };
    }

    function draw() {
      const q = $("q").value.toLowerCase();
      const list = rows.filter((r) => !q || [r.name, r.email, r.phone, r.id].join(" ").toLowerCase().includes(q));
      $("rows").innerHTML = list.map((r, i) => {
        const fc = foodCount(r);
        const people = [`${r.name} (${r.age})`, ...r.guests.map((g) => `${g.name} (${g.age})`)];
        return `<tr><td>${i + 1}</td><td><b>${esc(r.id)}</b></td>
          <td>${esc(r.name)}, ${r.age}<small>${esc(r.email)}</small></td><td>${esc(r.phone)}</td>
          <td>${r.count}<small>${esc(people.join(", "))}</small></td>
          <td>${fc.veg} veg / ${fc.nonveg} non-veg</td><td>${r.ethnic}</td><td>${inr(r.total)}</td>
          <td><small>${new Date(r.createdAt).toLocaleString("en-IN")}</small></td></tr>`;
      }).join("") || `<tr><td colspan="9">No registrations yet.</td></tr>`;

      const people = rows.reduce((s, r) => s + r.count, 0);
      const food = rows.reduce((s, r) => { const f = foodCount(r); s.v += f.veg; s.n += f.nonveg; return s; }, { v: 0, n: 0 });
      $("stats").innerHTML = [
        ["Registrations", rows.length], ["People", people], ["Expected", inr(people * 250)],
        ["Veg", food.v], ["Non-veg", food.n], ["Ethnic wear", rows.filter((r) => r.ethnic === "yes").length],
      ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
    }

    async function load() {
      $("err").hidden = true;
      const res = await fetch("/api/registrations", { headers: { "x-admin-key": $("key").value } });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) { $("err").textContent = out.error || "Failed to load."; $("err").hidden = false; return; }
      rows = out.rows;
      try { sessionStorage.setItem("adminKey", $("key").value); } catch {}
      $("out").hidden = false;
      $("csv").hidden = false;
      draw();
    }

    $("keyForm").addEventListener("submit", (e) => { e.preventDefault(); load(); });
    $("q").addEventListener("input", draw);
    $("csv").addEventListener("click", () => {
      const head = ["id", "role", "name", "age", "food", "email", "phone", "ethnic", "group_total", "created_at"];
      const lines = [head.join(",")];
      const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      rows.forEach((r) => {
        lines.push([r.id, "main", r.name, r.age, r.food, r.email, r.phone, r.ethnic, r.total, r.createdAt].map(q).join(","));
        r.guests.forEach((g) => lines.push([r.id, "guest", g.name, g.age, g.food, "", "", "", "", ""].map(q).join(",")));
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      a.download = "diwali-registrations.csv";
      a.click();
    });

    try { const k = sessionStorage.getItem("adminKey"); if (k) { $("key").value = k; load(); } } catch {}
  </script>
</body>
</html>
